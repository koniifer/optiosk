[package]
name = "optiosk"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = [
  "std",
  "help",
  "derive",
  "error-context",
], default-features = false }
eyre = { version = "0.6", default-features = false, features = [
  "auto-install",
] }
bitflags = "2"
hound = "3"
mozjpeg = { version = "0.10", features = ["with_simd"] }
minimp3 = "0.5"
optivorbis = { version = "0.3", default-features = false }
vorbis_rs = { version = "0.5", default-features = false }
oxipng = { version = "9", default-features = false }
memmap2 = "0.9"
piz = { version = "0.5", default-features = false }
rayon = "1"
camino = "1"
zune-png = "0.4"
file-format = "0.26"
zip = { version = "2", default-features = false, features = [
  "deflate-zlib",
  "bzip2",
] }

[profile.release]
strip = true

[profile.dev]
opt-level = 2
# god forbid a girl has fun
debug-assertions = false

[features]
debug = []
