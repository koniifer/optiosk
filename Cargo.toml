[package]
name = "optiosk"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = [
  "std",
  "help",
  "derive",
  "error-context",
], default-features = false }
eyre = { version = "0.6", default-features = false, features = [
  "auto-install",
] }
bitflags = "2"
hound = "3"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
mozjpeg = "0.10"
minimp3 = "0.5"
optivorbis = "0.3"
vorbis_rs = "0.5"
oxipng = { version = "9", default-features = false }
memmap2 = "0.9"
mtzip = { version = "4", features = [
  "rayon",
  "zlib",
], default-features = false }
piz = { version = "0.5", default-features = false }
rayon = "1"

[profile.release]
strip = true

[profile.dev]
# god forbid a girl has fun
debug-assertions = false
