[package]
name = "optiosk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", default-features = false }
clap = { version = "4.5", features = [
  "std",
  "help",
  "derive",
  "error-context",
], default-features = false }
hound = "3"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
minimp3 = "0.5"
mtzip = { version = "4", features = ["rayon"] }
optivorbis = "0.3"
oxipng = { version = "9", default-features = false }
piz = "0.5"
rayon = "1"
vorbis_rs = "0.5"
